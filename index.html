<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #121216; overflow: hidden; touch-action: none; }
  body { display: flex; flex-direction: column; align-items: center;
         font-family: system-ui, sans-serif; color: #fff; user-select: none; }
  #hud { text-align: center; padding: 10px 0 4px; }
  #score { font-size: 30px; font-weight: 700; line-height: 1.1; }
  #best { font-size: 14px; color: #9e9ea6; }
  canvas { display: block; }
</style>
</head>
<body>
  <div id="hud">
    <div id="score">0</div>
    <div id="best">Recorde: 0</div>
  </div>
  <canvas id="game"></canvas>
<script>
(function () {
  var COLS = 20, ROWS = 20, TICK_MS = 120;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');

  var cell, offsetX, offsetY, boardSize;
  var snake, dir, pendingDir, food, score, gameOver, started, lastTick = 0;
  var best = 0;
  try { best = parseInt(localStorage.getItem('snake_best') || '0', 10) || 0; } catch (e) {}

  /* ---- Chiptune: Hino da URSS (melodia de Alexandrov) ---- */
  var N = { G3: 196, B3: 246.94, C4: 261.63, D4: 293.66, E4: 329.63,
            F4: 349.23, G4: 392 };
  var P1 = [
    ['G3', .5], ['C4', 1], ['C4', .5], ['C4', .5], ['D4', .5], ['E4', 1],
    ['F4', .75], ['E4', .25], ['D4', 1], ['C4', .75], ['B3', .25], ['C4', 1],
    ['D4', 1], ['E4', 2], [null, .5]
  ];
  var P2 = [
    ['F4', .5], ['F4', .5], ['E4', .5], ['D4', .5], ['C4', 1],
    ['D4', .5], ['E4', .5], ['F4', .5], ['G4', 1],
    ['E4', .5], ['C4', .5], ['D4', 2], [null, .5]
  ];
  var MELODY = P1.concat(P2, P1.slice(0, 12), [['C4', 2], [null, 1]]);
  var audioCtx = null, musicTimer = null, noteIdx = 0, musicOn = false;

  function playNote() {
    if (!musicOn) return;
    var note = MELODY[noteIdx % MELODY.length];
    noteIdx++;
    var dur = note[1] * 0.38;
    if (note[0]) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = N[note[0]];
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur * 0.9);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    }
    musicTimer = setTimeout(playNote, dur * 1000);
  }

  function startMusic() {
    if (musicOn) return;
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    musicOn = true;
    playNote();
  }

  function stopMusic() {
    musicOn = false;
    if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    var hudH = document.getElementById('hud').offsetHeight;
    boardSize = Math.min(w - 16, h - hudH - 16, 560);
    canvas.width = canvas.height = boardSize;
    cell = Math.floor((boardSize - 12) / COLS);
    offsetX = Math.floor((boardSize - cell * COLS) / 2);
    offsetY = Math.floor((boardSize - cell * ROWS) / 2);
  }
  window.addEventListener('resize', resize);

  function reset() {
    var midY = Math.floor(ROWS / 2);
    snake = [{x:5,y:midY},{x:4,y:midY},{x:3,y:midY}];
    dir = {x:1,y:0}; pendingDir = {x:1,y:0};
    score = 0; gameOver = false; started = false;
    scoreEl.textContent = '0';
    spawnFood();
  }

  function spawnFood() {
    var p;
    do { p = {x: rnd(COLS), y: rnd(ROWS)}; }
    while (snake.some(function (s) { return s.x === p.x && s.y === p.y; }));
    p.special = Math.random() < 0.15;
    food = p;
  }
  function rnd(n) { return Math.floor(Math.random() * n); }

  function update() {
    dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS ||
        snake.some(function (s) { return s.x === nx && s.y === ny; })) {
      gameOver = true;
      stopMusic();
      if (score > best) { best = score; bestEl.textContent = 'Recorde: ' + best;
        try { localStorage.setItem('snake_best', String(best)); } catch (e) {} }
      return;
    }
    snake.unshift({x:nx, y:ny});
    if (nx === food.x && ny === food.y) {
      score += food.special ? 3 : 1;
      scoreEl.textContent = String(score);
      spawnFood();
    } else {
      snake.pop();
    }
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function drawHammerSickle(cx, cy, r, special) {
    ctx.lineWidth = r * 0.28;
    ctx.lineCap = 'round';
    ctx.strokeStyle = special ? '#e8382c' : '#ffd54f';
    ctx.beginPath();
    ctx.arc(cx - r * 0.1, cy - r * 0.15, r * 0.7, -Math.PI * 0.1, Math.PI * 0.8);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + r * 0.45, cy + r * 0.4);
    ctx.lineTo(cx + r * 0.05, cy + r * 0.85);
    ctx.stroke();
    ctx.strokeStyle = special ? '#1a3fc4' : '#ffd54f';
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.7, cy + r * 0.6);
    ctx.lineTo(cx - r * 0.1, cy - r * 0.1);
    ctx.stroke();
    ctx.fillStyle = ctx.strokeStyle;
    ctx.save();
    ctx.translate(cx - r * 0.15, cy - r * 0.25);
    ctx.rotate(-Math.PI / 4);
    ctx.fillRect(-r * 0.5, -r * 0.18, r, r * 0.36);
    ctx.restore();
  }

  function star(cx, cy, R) {
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var ang = -Math.PI / 2 + i * Math.PI / 5;
      var rad = i % 2 === 0 ? R : R * 0.45;
      var px = cx + rad * Math.cos(ang), py = cy + rad * Math.sin(ang);
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawTrumpHead(cx, cy, r) {
    ctx.fillStyle = '#f7b26a';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f5d76e';
    ctx.beginPath();
    ctx.ellipse(cx, cy - r * 0.55, r * 1.05, r * 0.5, 0, Math.PI, 0);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.5, cy - r * 0.8, r * 0.55, r * 0.3, -0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + r * 0.45, cy - r * 0.75, r * 0.45, r * 0.25, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx - r * 0.35, cy - r * 0.05, r * 0.22, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.35, cy - r * 0.05, r * 0.22, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a2a5a';
    ctx.beginPath();
    ctx.arc(cx - r * 0.35, cy - r * 0.05, r * 0.1, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.35, cy - r * 0.05, r * 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f5d76e';
    ctx.lineWidth = r * 0.14;
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.6, cy - r * 0.38);
    ctx.lineTo(cx - r * 0.12, cy - r * 0.3);
    ctx.moveTo(cx + r * 0.12, cy - r * 0.3);
    ctx.lineTo(cx + r * 0.6, cy - r * 0.38);
    ctx.stroke();
    ctx.strokeStyle = '#b3541f';
    ctx.lineWidth = r * 0.12;
    ctx.beginPath();
    ctx.arc(cx, cy + r * 0.25, r * 0.4, 0.25 * Math.PI, 0.75 * Math.PI);
    ctx.stroke();
    ctx.fillStyle = '#6b6b78';
    rr(cx - r * 1.05, cy - r * 0.95, r * 2.1, r * 0.55, r * 0.25);
    ctx.fillRect(cx - r * 1.05, cy - r * 0.6, r * 0.3, r * 0.75);
    ctx.fillRect(cx + r * 0.75, cy - r * 0.6, r * 0.3, r * 0.75);
    ctx.fillStyle = '#d32f2f';
    star(cx, cy - r * 0.62, r * 0.22);
  }

  function draw() {
    var size = canvas.width;
    ctx.fillStyle = '#121216';
    ctx.fillRect(0, 0, size, size);

    ctx.fillStyle = '#1e1e24';
    for (var x = 0; x < COLS; x++)
      for (var y = 0; y < ROWS; y++)
        if ((x + y) % 2 === 0)
          ctx.fillRect(offsetX + x * cell, offsetY + y * cell, cell, cell);

    ctx.strokeStyle = '#4a4a5a';
    ctx.lineWidth = 4;
    ctx.strokeRect(offsetX - 6, offsetY - 6, cell * COLS + 12, cell * ROWS + 12);

    drawHammerSickle(offsetX + food.x * cell + cell / 2, offsetY + food.y * cell + cell / 2, cell / 2.3, food.special);

    for (var i = snake.length - 1; i >= 0; i--) {
      var p = snake[i];
      if (i === 0) {
        drawTrumpHead(offsetX + p.x * cell + cell / 2, offsetY + p.y * cell + cell / 2, cell / 2.1);
      } else {
        ctx.fillStyle = '#4caf50';
        var pad = cell * 0.08;
        rr(offsetX + p.x * cell + pad, offsetY + p.y * cell + pad,
           cell - 2 * pad, cell - 2 * pad, cell * 0.2);
      }
    }

    function center(txt, dy, fs) {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = '700 ' + fs + 'px system-ui, sans-serif';
      ctx.fillText(txt, size / 2, size / 2 + dy);
    }

    if (!started) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, size, size);
      center('SNAKE', -size / 20, size / 15);
      ctx.font = size / 28 + 'px system-ui, sans-serif';
      ctx.fillStyle = '#9e9ea6';
      ctx.fillText('Setas/WASD ou deslize · Toque/Enter para começar', size / 2, size / 2 + size / 15);
    } else if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, size, size);
      center('Perdeu miserável!', -size / 20, size / 18);
      ctx.font = size / 28 + 'px system-ui, sans-serif';
      ctx.fillStyle = '#9e9ea6';
      ctx.fillText('Pontos: ' + score, size / 2, size / 2 + size / 30);
      ctx.fillText('Toque ou Enter para jogar de novo', size / 2, size / 2 + size / 12);
    }
  }

  function loop(t) {
    if (started && !gameOver && t - lastTick >= TICK_MS) {
      lastTick = t;
      update();
    }
    draw();
    requestAnimationFrame(loop);
  }

  function setDir(dx, dy) {
    if (dx !== -dir.x || dy !== -dir.y) pendingDir = {x:dx, y:dy};
  }

  function startOrRestart() {
    if (!started || gameOver) {
      if (gameOver) reset();
      started = true;
      startMusic();
    }
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') setDir(0, -1);
    else if (k === 'ArrowDown' || k === 's' || k === 'S') setDir(0, 1);
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') setDir(-1, 0);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') setDir(1, 0);
    else if (k === 'Enter' || k === ' ') startOrRestart();
    else return;
    e.preventDefault();
  });

  var tx = 0, ty = 0;
  canvas.addEventListener('touchstart', function (e) {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive: true});
  canvas.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) { startOrRestart(); return; }
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, {passive: true});

  canvas.addEventListener('mousedown', function () { startOrRestart(); });

  bestEl.textContent = 'Recorde: ' + best;
  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
