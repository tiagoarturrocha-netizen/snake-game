<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #121216; overflow: hidden; touch-action: none; }
  body { display: flex; flex-direction: column; align-items: center;
         font-family: system-ui, sans-serif; color: #fff; user-select: none; }
  #hud { text-align: center; padding: 10px 0 4px; }
  #score { font-size: 30px; font-weight: 700; line-height: 1.1; }
  #best { font-size: 14px; color: #9e9ea6; }
  canvas { display: block; border-radius: 8px; }
</style>
</head>
<body>
  <div id="hud">
    <div id="score">0</div>
    <div id="best">Recorde: 0</div>
  </div>
  <canvas id="game"></canvas>
<script>
(function () {
  var COLS = 20, ROWS = 20, TICK_MS = 120;
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');

  var cell, offsetX, offsetY;
  var snake, dir, pendingDir, food, score, gameOver, started, lastTick = 0;
  var best = 0;
  try { best = parseInt(localStorage.getItem('snake_best') || '0', 10) || 0; } catch (e) {}

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    var hudH = document.getElementById('hud').offsetHeight;
    var size = Math.min(w - 16, h - hudH - 16, 560);
    canvas.width = canvas.height = size;
    cell = Math.floor(size / COLS);
    offsetX = Math.floor((size - cell * COLS) / 2);
    offsetY = Math.floor((size - cell * ROWS) / 2);
  }
  window.addEventListener('resize', resize);

  function reset() {
    var midY = Math.floor(ROWS / 2);
    snake = [{x:5,y:midY},{x:4,y:midY},{x:3,y:midY}];
    dir = {x:1,y:0}; pendingDir = {x:1,y:0};
    score = 0; gameOver = false; started = false;
    scoreEl.textContent = '0';
    spawnFood();
  }

  function spawnFood() {
    var p;
    do { p = {x: rnd(COLS), y: rnd(ROWS)}; }
    while (snake.some(function (s) { return s.x === p.x && s.y === p.y; }));
    food = p;
  }
  function rnd(n) { return Math.floor(Math.random() * n); }

  function update() {
    dir = pendingDir;
    var head = snake[0];
    var nx = head.x + dir.x, ny = head.y + dir.y;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS ||
        snake.some(function (s) { return s.x === nx && s.y === ny; })) {
      gameOver = true;
      if (score > best) { best = score; bestEl.textContent = 'Recorde: ' + best;
        try { localStorage.setItem('snake_best', String(best)); } catch (e) {} }
      return;
    }
    snake.unshift({x:nx, y:ny});
    if (nx === food.x && ny === food.y) {
      score++; scoreEl.textContent = String(score); spawnFood();
    } else {
      snake.pop();
    }
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function draw() {
    var size = canvas.width;
    ctx.fillStyle = '#121216';
    ctx.fillRect(0, 0, size, size);

    ctx.fillStyle = '#1e1e24';
    for (var x = 0; x < COLS; x++)
      for (var y = 0; y < ROWS; y++)
        if ((x + y) % 2 === 0)
          ctx.fillRect(offsetX + x * cell, offsetY + y * cell, cell, cell);

    ctx.fillStyle = '#f44336';
    ctx.beginPath();
    ctx.arc(offsetX + food.x * cell + cell / 2, offsetY + food.y * cell + cell / 2,
            cell / 2.6, 0, Math.PI * 2);
    ctx.fill();

    for (var i = snake.length - 1; i >= 0; i--) {
      var p = snake[i];
      ctx.fillStyle = i === 0 ? '#8bc34a' : '#4caf50';
      var pad = cell * 0.08;
      rr(offsetX + p.x * cell + pad, offsetY + p.y * cell + pad,
         cell - 2 * pad, cell - 2 * pad, cell * 0.2);
    }

    function center(txt, dy, fs) {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.font = '700 ' + fs + 'px system-ui, sans-serif';
      ctx.fillText(txt, size / 2, size / 2 + dy);
    }

    if (!started) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, size, size);
      center('SNAKE', -size / 20, size / 15);
      ctx.font = size / 28 + 'px system-ui, sans-serif';
      ctx.fillStyle = '#9e9ea6';
      ctx.fillText('Setas/WASD ou deslize · Toque/Enter para começar', size / 2, size / 2 + size / 15);
    } else if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, size, size);
      center('GAME OVER', -size / 20, size / 15);
      ctx.font = size / 28 + 'px system-ui, sans-serif';
      ctx.fillStyle = '#9e9ea6';
      ctx.fillText('Pontos: ' + score, size / 2, size / 2 + size / 30);
      ctx.fillText('Toque ou Enter para jogar de novo', size / 2, size / 2 + size / 12);
    }
  }

  function loop(t) {
    if (started && !gameOver && t - lastTick >= TICK_MS) {
      lastTick = t;
      update();
    }
    draw();
    requestAnimationFrame(loop);
  }

  function setDir(dx, dy) {
    if (dx !== -dir.x || dy !== -dir.y) pendingDir = {x:dx, y:dy};
  }

  function startOrRestart() {
    if (!started || gameOver) {
      if (gameOver) reset();
      started = true;
    }
  }

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') setDir(0, -1);
    else if (k === 'ArrowDown' || k === 's' || k === 'S') setDir(0, 1);
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') setDir(-1, 0);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') setDir(1, 0);
    else if (k === 'Enter' || k === ' ') startOrRestart();
    else return;
    e.preventDefault();
  });

  var tx = 0, ty = 0;
  canvas.addEventListener('touchstart', function (e) {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, {passive: true});
  canvas.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) { startOrRestart(); return; }
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, {passive: true});

  canvas.addEventListener('mousedown', function () { startOrRestart(); });

  bestEl.textContent = 'Recorde: ' + best;
  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
